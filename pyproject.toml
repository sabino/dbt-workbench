[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "dbt-workbench"
version = "0.1.0"
description = "A local dbt workbench with explicit baselines and SQLGlot previews"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.9,<3",
  "PyYAML>=6,<7",
  "duckdb==1.5.6",
  "sqlglot==30.21.0",
  "pyarrow==25.0.0",
  "edn-format==0.7.5",
  "dbt-core==1.12.5",
  "dbt-duckdb==1.11.0",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "playwright>=1.50,<2"]

[project.scripts]
dbt-workbench = "dbt_workbench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dbt_workbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: uses real dbt and database files"]

